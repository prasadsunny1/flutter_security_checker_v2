name: flutter_security_checker_v2
description: Fork of flutter_security_checker with Swift Package Manager support. This plugin provides the ability to verify rooting and integrity on Android and iOS platforms.
version: 3.3.0
homepage: https://github.com/prasadsunny1/flutter_security_checker_v2
repository: https://github.com/prasadsunny1/flutter_security_checker_v2
issue_tracker: https://github.com/prasadsunny1/flutter_security_checker_v2/issues

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.pravera.flutter_security_checker
        pluginClass: FlutterSecurityCheckerPlugin
      ios:
        pluginClass: FlutterSecurityCheckerPlugin
